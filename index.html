<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

/* PAGE TRANSITION */
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: url('assets/Untitled(5).png') center/cover fixed;
  opacity: 0;
  transition: opacity 0.6s ease;
}

body.active {
  opacity: 1;
}

.fade-out {
  opacity: 0 !important;
}

/* ENTER SCREEN */
.enter-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  cursor: pointer;
}

.enter-screen h1 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  letter-spacing: 3px;
  color: white;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  text-shadow: 0 0 20px rgba(128,0,0,0.8);
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
}

.hero .top-role,
.hero .bottom-role,
.hero .mid,
.hero .sub {
  background: rgba(0,0,0,0.5);
  padding: 6px 14px;
  margin-top: 8px;
}

.hero .sub {
  font-size: 1.5rem;
  font-weight: 700;
}

.hero .top-role,
.hero .bottom-role {
  font-family: 'Bebas Neue';
  font-size: 2rem;
  text-shadow: 0 0 15px red;
}

/* PILLARS */
.pillar-left,
.pillar-right {
  position: fixed;
  top: 40px;
  height: 95vh;
  max-width: 420px;
  object-fit: contain;
  z-index: 1;
}

.pillar-right {
  right: -380px;
  animation: slideInRight 1.2s forwards;
}

.pillar-left {
  left: -380px;
  animation: slideInLeft 1.2s forwards;
}

@keyframes slideInRight { to { right: 0; } }
@keyframes slideInLeft { to { left: 0; } }

/* LOYALTY */
.loyalty-section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.85);
  text-align: center;
}

.loyalty-section h2 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  text-shadow: 0 0 10px red, 0 0 20px red;
}

/* MUSIC PLAYER */
.music-player {
  max-width: 600px;
  margin: 40px auto;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

/* TEAM */
.section {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
}

.artist-link {
  text-decoration: none;
  color: inherit;
}

.artist {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  text-align: center;
  transition: transform 0.3s;
}

.artist:hover {
  transform: scale(1.05);
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

/* PLATFORM ICONS */
.platforms {
  margin-top: 10px;
}

.platforms i {
  margin: 0 8px;
  font-size: 1.4rem;
  color: white;
  transition: 0.3s;
}

.platforms i:hover {
  color: red;
  transform: scale(1.2);
}

/* SOCIAL */
.social-section {
  text-align: center;
  padding: 40px;
  background: rgba(0,0,0,0.9);
}

.social-icons a {
  font-size: 2rem;
  margin: 10px;
  color: white;
}

.social-icons a:hover {
  color: red;
}
</style>
</head>

<body>

<!-- ENTER SCREEN -->
<div class="enter-screen" id="enterScreen">
  <h1>ENTER SITE</h1>
</div>

<!-- MUSIC -->
<audio id="bg-music" loop>
  <source src="assets/jong.mp3" type="audio/mpeg">
</audio>

<!-- PILLARS -->
<img src="assets/pillar-left.png" class="pillar-left">
<img src="assets/pillar-right.png" class="pillar-right">

<!-- HERO -->
<div class="hero">
  <div class="top-role">The Founder & CEO OG StarMoney</div>
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <div class="mid">183rd Davidson</div>
  <div class="sub">Uptown Boogie Down Bronx New York Finest</div>
  <div class="bottom-role">CFO K-Money Music</div>
</div>

<!-- LOYALTY -->
<div class="loyalty-section">
  <h2>Loyalty is everything, Death Before Dishonor</h2>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player">
  <h2>Now Playing</h2>
  <audio controls>
    <source src="assets/jong.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- TEAM -->
<div class="section">
  <h2>Meet the Artists</h2>

  <a href="og-starmoney.html" class="artist-link">
    <div class="artist">
      <img src="assets/Capture.PNG">
      <h3>OG StarMoney</h3>
      <div class="platforms">
        <i class="fab fa-spotify"></i>
        <i class="fab fa-apple"></i>
        <i class="fab fa-youtube"></i>
      </div>
    </div>
  </a>

  <a href="k-money.html" class="artist-link">
    <div class="artist">
      <img src="assets/k-money.svg">
      <h3>K-Money</h3>
      <div class="platforms">
        <i class="fab fa-spotify"></i>
        <i class="fab fa-apple"></i>
        <i class="fab fa-youtube"></i>
        <i class="fab fa-soundcloud"></i>
      </div>
    </div>
  </a>

</div>

<!-- SOCIALS -->
<div class="social-section">
  <div class="social-icons">
    <a href="https://www.instagram.com/starmoney_msp_790paybacktime_" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.youtube.com/@MSP790PAYBACKMUSIC" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://www.facebook.com/profile.php?id=100084085637674" target="_blank"><i class="fab fa-facebook"></i></a>
  </div>
</div>

<script>
const enterScreen = document.getElementById("enterScreen");
const audio = document.getElementById("bg-music");

/* ENTER SITE */
enterScreen.addEventListener("click", () => {
  audio.play();
  enterScreen.style.display = "none";
  document.body.classList.add("active");
});

/* PAGE LOAD FADE IN */
window.addEventListener("load", () => {
  document.body.classList.add("active");
});

/* PAGE TRANSITIONS */
document.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", function(e) {
    const href = this.getAttribute("href");

    if (href && !href.startsWith("#") && !this.hasAttribute("target")) {
      e.preventDefault();
      document.body.classList.remove("active");

      setTimeout(() => {
        window.location.href = href;
      }, 500);
    }
  });
});
</script>

</body>
</html>
