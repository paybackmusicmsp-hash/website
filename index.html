<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.8)), url('assets/image1.jpg') center/cover fixed;
  color: #fff;
  overflow-x: hidden;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  padding: 15px;
  text-align: center;
  font-family: 'Bebas Neue';
  font-size: 1.5rem;
  z-index: 1000;
}

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease forwards;
}

.hero .subtitle {
  margin-top: 18px;
  font-size: 34px;
  letter-spacing: 0.12em;
  font-weight: 700;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1.2s ease forwards;

  /* Glow effect */
  text-shadow:
    0 0 5px rgba(255,255,255,0.3),
    0 0 10px rgba(128,0,0,0.6),
    0 0 20px rgba(128,0,0,0.8);
}

/* Fade animation */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Scroll interaction (slight fade + scale) */
.hero.scrolled .subtitle {
  transform: scale(0.95);
  opacity: 0.7;
}

.section {
  padding: 80px 20px;
  max-width: 900px;
  margin: auto;
  opacity: 0;
  transform: translateY(40px);
  transition: all 0.6s ease;
}

.section.visible {
  opacity: 1;
  transform: translateY(0);
}

.takeover {
  height: 100vh;
}

.overlay {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.75);
  opacity: 0;
  transform: scale(0.95);
  transition: all 0.6s ease;
}

.overlay.active {
  opacity: 1;
  transform: scale(1);
}

.card {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.artist {
  text-align: center;
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

iframe {
  width: 100%;
  height: 400px;
  border-radius: 10px;
  margin-top: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  margin-top: 15px;
  padding: 12px;
  background: #800000;
  border: none;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
}

#form-status {
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease;
}

#form-status.show {
  opacity: 1;
  transform: translateY(0);
}

.success { color: #00ff88; }
.error { color: #ff4d4d; }

</style>
</head>

<body>

<header>
  MSP 790 PAYBACK MUSIC
</header>

<div class="hero" id="hero">
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <p class="subtitle">Uptown Boogie Down Bronx New York Finest</p>
</div>

<div class="takeover">
  <div id="overlay" class="overlay">
    <p>From 183rd and Davidson to everywhere.</p>
  </div>
</div>

<div class="section">
  <h2>Meet the Artists</h2>
</div>

<div class="section">
  <h2>Join the Movement</h2>
</div>

<script>
const overlay = document.getElementById('overlay');
const hero = document.getElementById('hero');

window.addEventListener('scroll', () => {
  const rect = overlay.parentElement.getBoundingClientRect();

  if (rect.top < window.innerHeight * 0.3) {
    overlay.classList.add('active');
  } else {
    overlay.classList.remove('active');
  }

  // scroll effect on subtitle
  if (window.scrollY > 100) {
    hero.classList.add('scrolled');
  } else {
    hero.classList.remove('scrolled');
  }

  // reveal sections
  document.querySelectorAll('.section').forEach(sec => {
    const r = sec.getBoundingClientRect();
    if (r.top < window.innerHeight * 0.85) {
      sec.classList.add('visible');
    }
  });
});
</script>

</body>
</html>
