<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: url('assets/Untitled(5).png') center/cover fixed;
  opacity: 0;
  transition: opacity 0.6s ease;
  isolation: isolate; /* FIX */
}

body.active { opacity: 1; }

/* ENTER SCREEN (FIXED ONLY) */
.enter-screen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,1); /* FORCE BLACK */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  cursor: pointer;
}

/* KEEP YOUR EXISTING ENTER TEXT + GLITCH */
.enter-screen h1 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  letter-spacing: 3px;
  text-shadow: 0 0 10px red, 0 0 25px red;
  animation: pulse 2s infinite;
  position: relative;
}

.enter-screen h1::before,
.enter-screen h1::after {
  content: "ENTER SITE";
  position: absolute;
  left: 0;
  width: 100%;
}

.enter-screen h1::before {
  color: red;
  animation: glitch 1s infinite;
}
.enter-screen h1::after {
  color: white;
  animation: glitch2 1.2s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(-2px,2px); }
  50% { transform: translate(2px,-2px); }
  75% { transform: translate(-2px,-2px); }
  100% { transform: translate(0); }
}
@keyframes glitch2 {
  0% { transform: translate(0); }
  25% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  75% { transform: translate(2px,2px); }
  100% { transform: translate(0); }
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  text-shadow: 0 0 20px rgba(128,0,0,0.8);
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
}

.hero .mid,
.hero .sub,
.hero .top-role,
.hero .bottom-role {
  background: rgba(0,0,0,0.5);
  padding: 6px 14px;
  margin-top: 8px;
}

.hero .mid { font-size: 1.2rem; }

.hero .sub {
  font-size: 1.6rem;
  font-weight: 700;
}

.hero .top-role,
.hero .bottom-role {
  font-family: 'Bebas Neue';
  font-size: 2rem;
  letter-spacing: 2px;
  text-shadow:
    0 0 5px red,
    0 0 15px red,
    0 0 25px red;
}

/* PILLARS */
.pillar-left,
.pillar-right {
  position: absolute;
  top: 40px;
  height: 95vh;
  width: auto;
  max-width: 420px;
  object-fit: contain;
  z-index: 1;
}

.pillar-left { left: -380px; }
.pillar-right { right: -380px; }

body.play-anim .pillar-left {
  animation: slideInLeft 1.2s ease forwards;
}
body.play-anim .pillar-right {
  animation: slideInRight 1.2s ease forwards;
}

@keyframes slideInLeft { to { left: 0; } }
@keyframes slideInRight { to { right: 0; } }

/* LOYALTY */
.loyalty-section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: rgba(0,0,0,0.85);
}

.loyalty-section h2 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  text-shadow:
    0 0 10px red,
    0 0 20px red;
}

/* TEAM */
.section {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
  position: relative;
  z-index: 2;
}

.artist {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  text-align: center;
  transition: transform 0.3s ease;
}

.artist:hover {
  transform: scale(1.05);
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

/* FORM */
.form-section {
  max-width: 600px;
  margin: 60px auto;
  background: rgba(0,0,0,0.8);
  padding: 25px;
  border-radius: 12px;
  position: relative;
  z-index: 2;
}

.form-section input,
.form-section textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 6px;
}

.form-section button {
  width: 100%;
  padding: 12px;
  background: #800000;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- ENTER -->
<div class="enter-screen" id="enterScreen">
  <h1>ENTER SITE</h1>
</div>

<audio id="bg-music" loop>
  <source src="assets/jong.mp3" type="audio/mpeg">
</audio>

<!-- PILLARS -->
<img src="assets/pillar-left.png" class="pillar-left">
<img src="assets/pillar-right.png" class="pillar-right">

<!-- HERO -->
<div class="hero">
  <div class="top-role">The Founder & CEO OG StarMoney</div>

  <h1>MSP 790 PAYBACK MUSIC</h1>

  <div class="mid">183rd Davidson</div>
  <div class="sub">Uptown Boogie Down Bronx New York Finest</div>

  <div class="bottom-role">CFO K-Money Music</div>
</div>

<!-- LOYALTY SECTION -->
<div class="loyalty-section">
  <h2>Loyalty is everything, Death Before Dishonor</h2>
</div>

<!-- TEAM -->
<div class="section">
  <h2>Meet the Artists</h2>

  <div class="artist">
    <img src="assets/Capture.PNG">
    <h3>OG StarMoney</h3>
  </div>

  <div class="artist">
    <img src="assets/k-money.svg">
    <h3>K-Money</h3>
  </div>
</div>

<!-- FORM -->
<div class="form-section">
  <h2>Join The Movement</h2>

  <input type="text" placeholder="Name">
  <input type="email" placeholder="Email">
  <input type="text" placeholder="Artist Name">
  <textarea rows="4" placeholder="Tell us about yourself"></textarea>

  <button>Submit</button>
</div>

<script>
const enterScreen = document.getElementById("enterScreen");
const audio = document.getElementById("bg-music");

enterScreen.addEventListener("click", () => {
  audio.play().catch(()=>{});
  enterScreen.style.display = "none";
  document.body.classList.add("active");
  document.body.classList.add("play-anim");
});
</script>

</body>
</html>
