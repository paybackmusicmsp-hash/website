<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: url('assets/Untitled(5).png') center/cover fixed;
  opacity: 0;
  transition: opacity 0.6s ease;
}

body.active { opacity: 1; }

/* ENTER SCREEN */
.enter-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  cursor: pointer;
}

.enter-screen h1 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  text-shadow: 0 0 15px red;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* HERO */
.hero {
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
}

.hero div {
  background: rgba(0,0,0,0.5);
  padding: 6px 14px;
  margin-top: 8px;
}

/* PILLARS */
.pillar-left, .pillar-right {
  position: absolute;
  top: 40px;
  height: 95%;
  max-width: 420px;
}

.pillar-left { left: -380px; }
.pillar-right { right: -380px; }

body.play-anim .pillar-left { animation: slideInLeft 1.2s forwards; }
body.play-anim .pillar-right { animation: slideInRight 1.2s forwards; }

@keyframes slideInLeft { to { left: 0; } }
@keyframes slideInRight { to { right: 0; } }

/* LOYALTY */
.loyalty-section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* JOIN BUTTON */
.join-section {
  text-align: center;
  padding: 60px 20px;
}

.join-btn {
  padding: 15px 30px;
  background: #800000;
  color: white;
  text-decoration: none;
  font-size: 1.2rem;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="enter-screen" id="enterScreen">
  <h1>ENTER SITE</h1>
</div>

<audio id="bg-music" loop>
  <source src="assets/jong.mp3" type="audio/mpeg">
</audio>

<div class="hero">
  <img src="assets/pillar-left.png" class="pillar-left">
  <img src="assets/pillar-right.png" class="pillar-right">

  <div>The Founder & CEO OG StarMoney</div>
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <div>183rd Davidson</div>
  <div>Uptown Boogie Down Bronx New York Finest</div>
  <div>CFO K-Money Music</div>
</div>

<div class="loyalty-section">
  <h2>Loyalty is everything, Death Before Dishonor</h2>
</div>

<div class="join-section">
  <h2>Join The Movement</h2>
  <a href="join.html" class="join-btn">Apply Now</a>
</div>

<script>
document.getElementById("enterScreen").onclick = () => {
  document.getElementById("bg-music").play();
  document.body.classList.add("active","play-anim");
  enterScreen.style.display = "none";
};
</script>

</body>
</html>
