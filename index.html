<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #000;
  color: #fff;
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: rgba(0,0,0,0.7);
  padding: 15px;
  text-align: center;
  font-family: 'Bebas Neue';
  font-size: 1.5rem;
  z-index: 1000;
}

/* HERO TEXT */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Animated logo */
.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  animation: glowPulse 3s infinite alternate;
}

@keyframes glowPulse {
  from { text-shadow: 0 0 10px rgba(128,0,0,0.4); }
  to { text-shadow: 0 0 25px rgba(128,0,0,0.9); }
}

.subtitle {
  font-size: 34px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-shadow:
    0 0 5px rgba(255,255,255,0.3),
    0 0 10px rgba(128,0,0,0.6),
    0 0 20px rgba(128,0,0,0.8);
}

/* HERO IMAGE SECTION */
.hero-image {
  position: relative;
  height: 100vh;
  background: url('assets/hero.jpg') center/cover no-repeat;
  display: flex;
  align-items: flex-end;
}

.hero-caption {
  width: 100%;
  background: rgba(0,0,0,0.6);
  padding: 20px;
  font-family: 'Bebas Neue';
  font-size: 1.8rem;
  letter-spacing: 0.1em;
}

/* SECTIONS */
.section {
  padding: 80px 20px;
  max-width: 1000px;
  margin: auto;
  text-align: center;
}

h2 {
  font-family: 'Bebas Neue';
  font-size: 2.5rem;
}

/* ARTISTS */
.artist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
  margin-top: 30px;
}

.artist {
  background: #111;
  border-radius: 12px;
  padding: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.artist:hover {
  transform: scale(1.05) translateY(-5px);
  box-shadow: 0 10px 30px rgba(128,0,0,0.6);
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

/* MUSIC PLAYER */
.music-player iframe {
  width: 100%;
  height: 120px;
  margin-top: 20px;
  border-radius: 10px;
}

/* BUTTON */
button {
  padding: 12px;
  background: #800000;
  border: none;
  color: #fff;
  border-radius: 8px;
  margin-top: 15px;
  cursor: pointer;
}

button:hover {
  background: #a00000;
  transform: scale(1.05);
}
</style>
</head>

<body>

<header>MSP 790 PAYBACK MUSIC</header>

<!-- HERO TEXT -->
<div class="hero">
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <p class="subtitle">Uptown Boogie Down Bronx New York Finest</p>
</div>

<!-- HERO IMAGE -->
<div class="hero-image">
  <div class="hero-caption">
    Pictured: OG StarMoney
  </div>
</div>

<!-- ARTISTS -->
<div class="section">
  <h2>Artists</h2>

  <div class="artist-grid">

    <div class="artist" onclick="playTrack('star')">
      <img src="assets/star-money-meet-the-artist1.jpg">
      <h3>OG StarMoney</h3>
    </div>

    <div class="artist" onclick="playTrack('k')">
      <img src="assets/k-money.svg">
      <h3>K-Money</h3>
    </div>

  </div>
</div>

<!-- MUSIC PLAYER -->
<div class="section music-player">
  <h2>Now Playing</h2>
  <iframe id="player" src=""></iframe>
</div>

<script>
function playTrack(track) {
  const player = document.getElementById('player');

  if(track === 'star') {
    player.src = "https://www.youtube.com/embed/YOUR_VIDEO_ID";
  }

  if(track === 'k') {
    player.src = "https://www.youtube.com/embed/YOUR_VIDEO_ID_2";
  }
}
</script>

</body>
</html>
