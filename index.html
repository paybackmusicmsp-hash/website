<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: url('assets/image1.jpg') center/cover fixed;
  overflow-x: hidden;
}

/* PILLAR SCENE */
.pillar-scene {
  position: relative;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.scene-center {
  text-align: center;
  z-index: 2;
}

.scene-center h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  text-shadow: 0 0 20px rgba(128,0,0,0.8);
}

.scene-center .mid {
  font-size: 1.2rem;
  margin-top: 8px;
  letter-spacing: 0.1em;
}

.scene-center .subtitle {
  margin-top: 6px;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.12em;
}

/* SIDE ARTISTS */
.pillar-left,
.pillar-right {
  position: absolute;
  bottom: 0;
}

/* 🔥 START OFF SCREEN */
.pillar-right {
  right: -300px;
  animation: slideInRight 1s ease forwards;
}

.pillar-left {
  left: -300px;
  animation: slideInLeft 1s ease forwards;
}

/* IMAGE SIZE */
.pillar-left img,
.pillar-right img {
  height: 90vh;
  object-fit: contain;
}

/* 🔥 ANIMATIONS */
@keyframes slideInRight {
  to {
    right: 0;
  }
}

@keyframes slideInLeft {
  to {
    left: 0;
  }
}

/* MAIN CONTENT */
.main {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
}

/* ARTISTS */
.artist {
  margin-top: 30px;
  text-align: center;
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

h2 {
  font-family: 'Bebas Neue';
  margin-top: 40px;
}

/* FORM */
.form-section {
  margin-top: 60px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  margin-top: 15px;
  padding: 12px;
  background: #800000;
  border: none;
  color: #fff;
  border-radius: 8px;
}

/* MOBILE */
@media (max-width: 900px) {
  .pillar-left,
  .pillar-right {
    display: none;
  }
}
</style>
</head>

<body>

<div class="pillar-scene">

  <div class="pillar-left">
    <!-- placeholder -->
    <!-- <img src="assets/LEFT-ARTIST.png"> -->
  </div>

  <div class="pillar-right">
    <img src="assets/RIGHT-ARTIST.png">
  </div>

  <div class="scene-center">
    <h1>MSP 790 PAYBACK MUSIC</h1>
    <div class="mid">183rd Davidson</div>
    <div class="subtitle">Uptown Boogie Down Bronx New York Finest</div>
  </div>

</div>

<div class="main">

  <h2>Meet the Artists</h2>

  <div class="artist">
    <img src="assets/star-money-meet-the-artist1.jpg">
    <h3>OG StarMoney</h3>
    <p>Professional Dance Choreographer From THE BRONX NY, Song Writer, Rapper, CEO.</p>
  </div>

  <div class="artist">
    <img src="assets/k-money.svg">
    <h3>K-Money</h3>
    <p>General Consultant, Singer, Photographer & Videographer, CFO.</p>
  </div>

  <div class="form-section">
    <h2>Join MSP</h2>

    <input type="text" placeholder="Name">
    <input type="email" placeholder="Email">
    <input type="text" placeholder="Artist Name">
    <textarea rows="4" placeholder="Tell us about yourself"></textarea>

    <button>Submit</button>
  </div>

</div>

</body>
</html>
