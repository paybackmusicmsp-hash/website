<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('assets/hero.jpg') center/cover no-repeat fixed;
  color: #fff;
}

/* HEADER */
header {
  position: fixed;
  width: 100%;
  background: rgba(0,0,0,0.7);
  padding: 15px;
  text-align: center;
  font-family: 'Bebas Neue';
  font-size: 1.5rem;
}

/* HERO TEXT */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* LOGO */
.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  animation: glowPulse 3s infinite alternate;
}

@keyframes glowPulse {
  from { text-shadow: 0 0 10px rgba(128,0,0,0.4); }
  to { text-shadow: 0 0 25px rgba(128,0,0,0.9); }
}

.subtitle {
  font-size: 32px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-shadow: 0 0 15px rgba(128,0,0,0.8);
}

/* CAPTION */
.caption {
  text-align: center;
  font-family: 'Bebas Neue';
  font-size: 1.5rem;
  margin-top: -40px;
  margin-bottom: 40px;
  opacity: 0.8;
}

/* SECTIONS */
.section {
  padding: 60px 20px;
  max-width: 1000px;
  margin: auto;
  text-align: center;
}

/* ARTISTS */
.artist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
}

.artist {
  background: #111;
  border-radius: 12px;
  padding: 15px;
  transition: 0.3s;
  cursor: pointer;
}

.artist:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 30px rgba(128,0,0,0.6);
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

/* PLAYER */
.music-player iframe {
  width: 100%;
  height: 120px;
  margin-top: 20px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>MSP 790 PAYBACK MUSIC</header>

<div class="hero">
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <p class="subtitle">Uptown Boogie Down Bronx New York Finest</p>
</div>

<!-- ✅ THIS IS THE CORRECT WAY TO ADD IT -->
<div class="caption">
  Pictured: OG StarMoney
</div>

<div class="section">
  <h2>Artists</h2>

  <div class="artist-grid">

    <div class="artist" onclick="playTrack('star')">
      <img src="assets/star-money-meet-the-artist1.jpg">
      <h3>OG StarMoney</h3>
    </div>

    <div class="artist" onclick="playTrack('k')">
      <img src="assets/k-money.svg">
      <h3>K-Money</h3>
    </div>

  </div>
</div>

<div class="section music-player">
  <h2>Now Playing</h2>
  <iframe id="player" src=""></iframe>
</div>

<script>
function playTrack(track) {
  const player = document.getElementById('player');

  if(track === 'star') {
    player.src = "https://www.youtube.com/embed/YOUR_VIDEO_ID";
  }

  if(track === 'k') {
    player.src = "https://www.youtube.com/embed/YOUR_VIDEO_ID_2";
  }
}
</script>

</body>
</html>
