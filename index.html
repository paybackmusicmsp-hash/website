<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  overflow-x: hidden;
  background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.8)), url('assets/image1.jpg') center/cover fixed;
}

/* SIDE PILLARS (non-intrusive) */
.pillar {
  position: fixed;
  top: 0;
  height: 100vh;
  width: 180px;
  z-index: 1;
  pointer-events: none;
  opacity: 0.9;
}

.pillar-left {
  left: 0;
}

.pillar-right {
  right: 0;
}

.pillar img {
  height: 100%;
  object-fit: contain;
}

/* MAIN CONTENT stays centered */
.main {
  position: relative;
  z-index: 2;
  max-width: 900px;
  margin: auto;
  padding: 80px 20px;
}

/* HERO TEXT ONLY (no card anymore) */
.hero {
  text-align: center;
  margin-bottom: 60px;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 3.5rem;
}

.hero .subtitle {
  font-weight: 700;
  letter-spacing: 0.12em;
  font-size: 1.2rem;
}

/* SECTIONS */
.section {
  margin-top: 60px;
}

/* ARTISTS (UNCHANGED STYLE) */
.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

/* FORM */
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

button {
  margin-top: 15px;
  padding: 12px;
  background: #800000;
  border: none;
  color: #fff;
  border-radius: 8px;
}

/* MEDIA */
iframe {
  width: 100%;
  height: 400px;
  border-radius: 10px;
  margin-top: 20px;
}

/* MOBILE */
@media (max-width: 900px) {
  .pillar {
    display: none;
  }
}
</style>
</head>

<body>

<!-- LEFT PILLAR (placeholder for now) -->
<div class="pillar pillar-left">
  <!-- leave empty or add later -->
</div>

<!-- RIGHT PILLAR (your cutout) -->
<div class="pillar pillar-right">
  <img src="assets/RIGHT-ARTIST.png">
</div>

<div class="main">

  <!-- HERO TEXT -->
  <div class="hero">
    <h1>MSP 790 PAYBACK MUSIC</h1>
    <div class="subtitle">Uptown Boogie Down Bronx New York Finest</div>
  </div>

  <!-- MEET THE ARTISTS (UNCHANGED) -->
  <div class="section">
    <h2>Meet the Artists</h2>

    <div class="artist">
      <img src="assets/star-money-meet-the-artist1.jpg">
      <h3>OG StarMoney</h3>
      <p>Professional Dance Choreographer From THE BRONX NY, Song Writer, Rapper, CEO.</p>
    </div>

    <div class="artist">
      <img src="assets/k-money.svg">
      <h3>K-Money</h3>
      <p>General Consultant, Singer, Photographer & Videographer, CFO.</p>
    </div>
  </div>

  <!-- SUBMISSION -->
  <div class="section">
    <h2>Join the Movement</h2>

    <form action="https://formspree.io/f/xdapqqll" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Tell us about your music"></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>

  <!-- MEDIA -->
  <div class="section">
    <h2>Media</h2>

    <iframe src="https://www.youtube.com/embed/Vt05I9jqteY" allowfullscreen></iframe>
    <iframe src="https://www.instagram.com/p/DWvRNnlGMty/embed/" allowfullscreen></iframe>
  </div>

</div>

</body>
</html>
