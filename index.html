<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: url('assets/Untitled(5).png') center/cover fixed;
  isolation: isolate;
  padding-bottom: 100px;
}

/* ENTER SCREEN */
.enter-screen {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999999;
  cursor: pointer;
  opacity: 1;
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.enter-screen h1 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  letter-spacing: 3px;
  text-shadow: 0 0 10px red, 0 0 25px red;
  animation: pulse 2s infinite;
  position: relative;
  padding: 20px;
}
.enter-screen h1::before,
.enter-screen h1::after {
  content: "ENTER SITE";
  position: absolute;
  left: 0;
  width: 100%;
}
.enter-screen h1::before {
  color: red;
  animation: glitch 1s infinite;
}
.enter-screen h1::after {
  color: white;
  animation: glitch2 1.2s infinite;
}
.enter-screen.fade-out {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

/* ANIMATIONS */
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
@keyframes glitch {
  0% { transform: translate(0); }
  25% { transform: translate(-2px,2px); }
  50% { transform: translate(2px,-2px); }
  75% { transform: translate(-2px,-2px); }
  100% { transform: translate(0); }
}
@keyframes glitch2 {
  0% { transform: translate(0); }
  25% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  75% { transform: translate(2px,2px); }
  100% { transform: translate(0); }
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  position: relative;
  z-index: 2;
  padding: 20px;
}
.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  text-shadow: 0 0 20px rgba(128,0,0,0.8);
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
  margin: 0;
}
.hero .mid,
.hero .sub,
.hero .top-role,
.hero .bottom-role {
  background: rgba(0,0,0,0.5);
  padding: 6px 14px;
  margin-top: 8px;
}
.hero .sub {
  font-size: 1.6rem;
  font-weight: 700;
}
.hero .top-role,
.hero .bottom-role {
  font-family: 'Bebas Neue';
  font-size: 2rem;
  letter-spacing: 2px;
  text-shadow: 0 0 5px red, 0 0 15px red, 0 0 25px red;
}

/* PILLARS */
.pillar-left,
.pillar-right {
  position: absolute;
  top: 40px;
  height: 95vh;
  max-width: 420px;
  object-fit: contain;
  z-index: 1;
}
.pillar-left { left: -380px; }
.pillar-right { right: -380px; }

body.play-anim .pillar-left {
  animation: slideInLeft 1.2s ease forwards;
}
body.play-anim .pillar-right {
  animation: slideInRight 1.2s ease forwards;
}
@keyframes slideInLeft { to { left: 0; } }
@keyframes slideInRight { to { right: 0; } }

/* LOYALTY */
.loyalty-section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: rgba(0,0,0,0.85);
  padding: 20px;
}
.loyalty-section h2 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  text-shadow: 0 0 10px red, 0 0 20px red;
  padding: 0 20px;
}

/* ARTISTS */
.section {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
  position: relative;
  z-index: 2;
}
.section h2 {
  font-size: 2.5rem;
  text-align: center;
  font-family: 'Bebas Neue';
}
.artist {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  text-align: center;
  transition: transform 0.3s ease;
}
.artist:hover {
  transform: scale(1.05);
}
.artist:active {
  transform: scale(0.98);
}
.artist-link {
  display: block;
  text-decoration: none;
  color: inherit;
}
.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}
.artist h3 {
  margin: 15px 0 10px 0;
  font-size: 1.5rem;
}

/* ICONS */
.artist-icons {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  gap: 15px;
}
.artist-icons a {
  font-size: 1.8rem;
  color: white;
  transition: color 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 50px;
  min-height: 50px;
}
.artist-icons a:hover {
  color: red;
}

/* JOIN */
.join-section {
  text-align: center;
  padding: 60px 20px;
}
.join-btn {
  padding: 14px 30px;
  background: #800000;
  color: white;
  text-decoration: none;
  font-size: 1.2rem;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: background 0.3s ease;
  display: inline-block;
}
.join-btn:hover {
  background: #a00000;
}
.join-btn:active {
  transform: scale(0.95);
}

/* FOOTER */
.footer-bar {
  width: 100%;
  background: black;
  display: flex;
  justify-content: space-around;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px 10px;
  border-top: 1px solid #222;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 1000;
  box-sizing: border-box;
}
.footer-bar a {
  color: white;
  text-decoration: none;
  font-family: 'Bebas Neue';
  font-size: 1.2rem;
  padding: 8px 12px;
  transition: color 0.3s ease;
  white-space: nowrap;
}
.footer-bar a:hover {
  color: red;
}

/* TABLET */
@media (max-width: 1024px) {
  .pillar-left,
  .pillar-right {
    max-width: 300px;
    left: -250px !important;
    right: -250px !important;
  }
  
  .hero h1 {
    font-size: 3rem;
  }
  
  .hero .top-role,
  .hero .bottom-role {
    font-size: 1.5rem;
  }
  
  .loyalty-section h2 {
    font-size: 2.5rem;
  }
  
  .section h2 {
    font-size: 2rem;
  }
}

/* MOBILE - Medium phones (768px and below) */
@media (max-width: 768px) {
  .pillar-left,
  .pillar-right {
    display: none;
  }
  
  .enter-screen h1 {
    font-size: 2rem;
    letter-spacing: 2px;
  }
  
  .hero {
    height: auto;
    min-height: 60vh;
    padding: 40px 20px;
  }
  
  .hero h1 {
    font-size: 2.5rem;
    padding: 10px 15px;
  }
  
  .hero .mid,
  .hero .sub,
  .hero .top-role,
  .hero .bottom-role {
    padding: 8px 12px;
    margin-top: 6px;
    font-size: 1rem;
  }
  
  .hero .sub {
    font-size: 1.2rem;
  }
  
  .hero .top-role,
  .hero .bottom-role {
    font-size: 1.3rem;
  }
  
  .loyalty-section {
    height: auto;
    min-height: 40vh;
    padding: 40px 20px;
  }
  
  .loyalty-section h2 {
    font-size: 1.8rem;
    line-height: 1.3;
  }
  
  .section {
    padding: 40px 15px;
  }
  
  .section h2 {
    font-size: 1.8rem;
  }
  
  .artist {
    padding: 15px;
    margin-top: 15px;
  }
  
  .artist img {
    height: 200px;
  }
  
  .artist h3 {
    font-size: 1.3rem;
    margin: 12px 0 8px 0;
  }
  
  .artist-icons {
    gap: 12px;
  }
  
  .artist-icons a {
    font-size: 1.6rem;
    min-width: 45px;
    min-height: 45px;
  }
  
  .join-section {
    padding: 40px 20px;
  }
  
  .join-btn {
    padding: 12px 25px;
    font-size: 1rem;
  }
  
  .footer-bar {
    padding: 10px 8px;
    gap: 5px;
  }
  
  .footer-bar a {
    font-size: 1rem;
    padding: 6px 10px;
  }
  
  body {
    padding-bottom: 120px;
  }
}

/* MOBILE - Small phones (480px and below) */
@media (max-width: 480px) {
  .enter-screen h1 {
    font-size: 1.5rem;
    letter-spacing: 1px;
  }
  
  .hero {
    min-height: 50vh;
    padding: 30px 15px;
  }
  
  .hero h1 {
    font-size: 2rem;
    padding: 8px 12px;
  }
  
  .hero .mid,
  .hero .sub,
  .hero .top-role,
  .hero .bottom-role {
    padding: 6px 10px;
    margin-top: 5px;
    font-size: 0.9rem;
  }
  
  .hero .sub {
    font-size: 1rem;
  }
  
  .hero .top-role,
  .hero .bottom-role {
    font-size: 1.1rem;
  }
  
  .loyalty-section {
    min-height: 35vh;
    padding: 30px 15px;
  }
  
  .loyalty-section h2 {
    font-size: 1.4rem;
  }
  
  .section {
    padding: 30px 10px;
  }
  
  .section h2 {
    font-size: 1.5rem;
  }
  
  .artist {
    padding: 12px;
    margin-top: 12px;
  }
  
  .artist img {
    height: 180px;
  }
  
  .artist h3 {
    font-size: 1.1rem;
    margin: 10px 0 6px 0;
  }
  
  .artist-icons {
    gap: 10px;
  }
  
  .artist-icons a {
    font-size: 1.4rem;
    min-width: 40px;
    min-height: 40px;
  }
  
  .join-section {
    padding: 30px 15px;
  }
  
  .join-btn {
    padding: 10px 20px;
    font-size: 0.95rem;
  }
  
  .footer-bar {
    padding: 8px 5px;
    gap: 3px;
  }
  
  .footer-bar a {
    font-size: 0.9rem;
    padding: 5px 8px;
  }
  
  body {
    padding-bottom: 140px;
  }
}

/* Extra small phones (360px and below) */
@media (max-width: 360px) {
  .footer-bar {
    flex-direction: column;
    gap: 0;
  }
  
  .footer-bar a {
    width: 100%;
    text-align: center;
    padding: 10px 5px;
    border-bottom: 1px solid #333;
  }
  
  .footer-bar a:last-child {
    border-bottom: none;
  }
  
  .hero h1 {
    font-size: 1.5rem;
  }
  
  .section h2 {
    font-size: 1.3rem;
  }
}

/* Touch device improvements */
@media (hover: none) and (pointer: coarse) {
  .artist:active {
    background: #1a1a1a;
  }
  
  .footer-bar a:active {
    opacity: 0.7;
  }
}
</style>
</head>

<body>

<div class="enter-screen" id="enterScreen">
  <h1>ENTER SITE</h1>
</div>

<audio id="bg-music" loop>
  <source src="assets/jong.mp3" type="audio/mpeg">
</audio>

<img src="assets/pillar-left(1).png" class="pillar-left">
<img src="assets/pillar-right.png" class="pillar-right">

<div class="hero">
  <div class="top-role">The Founder & CEO OG StarMoney</div>
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <div class="mid">183rd Davidson</div>
  <div class="sub">Uptown Boogie Down Bronx New York Finest</div>
  <div class="bottom-role">CFO K-Money Music</div>
</div>

<div class="loyalty-section">
  <h2>Loyalty is everything, Death Before Dishonor</h2>
</div>

<div class="section" id="artists">
  <h2>Meet the Artists</h2>

  <div class="artist">
    <a href="og-starmoney.html" class="artist-link">
      <img src="assets/Capture.PNG" alt="OG StarMoney">
      <h3>OG StarMoney</h3>
    </a>
    <div class="artist-icons">
      <a href="https://www.instagram.com/starmoney_msp_790paybacktime_" target="_blank" rel="noopener noreferrer" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.youtube.com/@MSP790PAYBACKMUSIC" target="_blank" rel="noopener noreferrer" title="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="https://www.facebook.com/profile.php?id=100084085637674" target="_blank" rel="noopener noreferrer" title="Facebook"><i class="fab fa-facebook"></i></a>
    </div>
  </div>

  <div class="artist">
    <a href="k-money.html" class="artist-link">
      <img src="assets/k-money.svg" alt="K-Money">
      <h3>K-Money</h3>
    </a>
  </div>
</div>

<div class="footer-bar">
  <a href="index.html">Home</a>
  <a href="join.html">Join</a>
  <a href="#artists">Artists</a>
  <a href="book.html">Book</a>
  <a href="client-auth.html">Login</a>
</div>

<script>
document.getElementById("enterScreen").addEventListener("click", async () => {
  const screen = document.getElementById("enterScreen");
  const music = document.getElementById("bg-music");

  if (music) {
    music.volume = 0.6;
    try {
      await music.play();
    } catch (e) {
      console.log("Audio blocked", e);
    }
  }

  screen.classList.add("fade-out");

  setTimeout(() => {
    screen.style.display = "none";
    document.body.classList.add("play-anim");
  }, 800);
});
</script>

</body>
</html>
