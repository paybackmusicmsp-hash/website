<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSP 790 PAYBACK MUSIC</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  background: url('assets/Untitled(5).png') center/cover fixed;
  opacity: 0;
  transition: opacity 0.6s ease;
}

body.active {
  opacity: 1;
}

/* ENTER SCREEN */
.enter-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  cursor: pointer;
  overflow: hidden;
}

.enter-screen h1 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  letter-spacing: 3px;
  color: white;
  position: relative;
  animation: pulse 2s infinite;
  text-shadow: 0 0 10px red, 0 0 25px red;
}

/* glitch layers */
.enter-screen h1::before,
.enter-screen h1::after {
  content: "ENTER SITE";
  position: absolute;
  left: 0;
  width: 100%;
}

.enter-screen h1::before {
  color: red;
  animation: glitch 1s infinite;
}

.enter-screen h1::after {
  color: white;
  animation: glitch2 1.2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 0.8; }
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px,2px); }
  40% { transform: translate(-2px,-2px); }
  60% { transform: translate(2px,2px); }
  80% { transform: translate(2px,-2px); }
  100% { transform: translate(0); }
}

@keyframes glitch2 {
  0% { transform: translate(0); }
  25% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  75% { transform: translate(2px,2px); }
  100% { transform: translate(0); }
}

/* HERO */
.hero {
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  z-index: 2;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  text-shadow: 0 0 20px rgba(128,0,0,0.8);
  background: rgba(0,0,0,0.5);
  padding: 8px 16px;
}

.hero .top-role,
.hero .bottom-role,
.hero .mid,
.hero .sub {
  background: rgba(0,0,0,0.5);
  padding: 6px 14px;
  margin-top: 8px;
}

.hero .sub {
  font-size: 1.5rem;
  font-weight: 700;
}

.hero .top-role,
.hero .bottom-role {
  font-family: 'Bebas Neue';
  font-size: 2rem;
  text-shadow: 0 0 15px red;
}

/* PILLARS (animation now controlled by class) */
.pillar-left,
.pillar-right {
  position: absolute;
  top: 40px;
  height: 95%;
  max-width: 420px;
  object-fit: contain;
  z-index: 1;
}

/* START OFF SCREEN */
.pillar-left {
  left: -380px;
}

.pillar-right {
  right: -380px;
}

/* ANIMATE ONLY AFTER ENTER */
body.play-anim .pillar-left {
  animation: slideInLeft 1.2s ease forwards;
}

body.play-anim .pillar-right {
  animation: slideInRight 1.2s ease forwards;
}

@keyframes slideInRight {
  to { right: 0; }
}

@keyframes slideInLeft {
  to { left: 0; }
}

/* LOYALTY */
.loyalty-section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.85);
  text-align: center;
}

.loyalty-section h2 {
  font-family: 'Bebas Neue';
  font-size: 3rem;
  text-shadow: 0 0 10px red, 0 0 20px red;
}

/* MUSIC PLAYER */
.music-player {
  max-width: 600px;
  margin: 40px auto;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

/* TEAM */
.section {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
}

.artist-link {
  text-decoration: none;
  color: inherit;
}

.artist {
  background: #111;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  text-align: center;
  transition: transform 0.3s;
}

.artist:hover {
  transform: scale(1.05);
}

.artist img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
}

/* SOCIAL */
.social-section {
  text-align: center;
  padding: 40px;
  background: rgba(0,0,0,0.9);
}

.social-icons a {
  font-size: 2rem;
  margin: 10px;
  color: white;
}

.social-icons a:hover {
  color: red;
}
</style>
</head>

<body>

<!-- ENTER SCREEN -->
<div class="enter-screen" id="enterScreen">
  <h1>ENTER SITE</h1>
</div>

<!-- MUSIC -->
<audio id="bg-music" loop>
  <source src="assets/jong.mp3" type="audio/mpeg">
</audio>

<!-- HERO -->
<div class="hero">

  <img src="assets/pillar-left.png" class="pillar-left">
  <img src="assets/pillar-right.png" class="pillar-right">

  <div class="top-role">The Founder & CEO OG StarMoney</div>
  <h1>MSP 790 PAYBACK MUSIC</h1>
  <div class="mid">183rd Davidson</div>
  <div class="sub">Uptown Boogie Down Bronx New York Finest</div>
  <div class="bottom-role">CFO K-Money Music</div>
</div>

<!-- LOYALTY -->
<div class="loyalty-section">
  <h2>Loyalty is everything, Death Before Dishonor</h2>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player">
  <h2>Now Playing</h2>
  <audio controls>
    <source src="assets/jong.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- TEAM -->
<div class="section">
  <h2>Meet the Artists</h2>

  <a href="og-starmoney.html" class="artist-link">
    <div class="artist">
      <img src="assets/Capture.PNG">
      <h3>OG StarMoney</h3>
    </div>
  </a>

  <a href="k-money.html" class="artist-link">
    <div class="artist">
      <img src="assets/k-money.svg">
      <h3>K-Money</h3>
    </div>
  </a>
</div>

<!-- SOCIAL -->
<div class="social-section">
  <div class="social-icons">
    <a href="https://www.instagram.com/starmoney_msp_790paybacktime_" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.youtube.com/@MSP790PAYBACKMUSIC" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://www.facebook.com/profile.php?id=100084085637674" target="_blank"><i class="fab fa-facebook"></i></a>
  </div>
</div>

<script>
const enterScreen = document.getElementById("enterScreen");
const audio = document.getElementById("bg-music");

enterScreen.addEventListener("click", () => {
  audio.play();
  enterScreen.style.display = "none";
  document.body.classList.add("active");
  document.body.classList.add("play-anim"); // TRIGGERS PILLAR ANIMATION
});
</script>

</body>
</html>
