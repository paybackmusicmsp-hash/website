<!DOCTYPE html>
<html>
<head>
<title>MSP Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial}
.app{display:flex}
.sidebar{
  width:240px;
  background:#111;
  height:100vh;
  padding:20px;
  border-right:1px solid #222;
}
.sidebar h2{color:red}
.sidebar p{cursor:pointer;color:#aaa}
.sidebar p:hover{color:white}

.main{flex:1}
.top{
  background:#111;
  padding:15px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #222;
}

.content{padding:20px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.stat{
  background:#111;
  padding:20px;
  border-radius:10px;
}

.card{
  background:#111;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.pending{color:gold}
.accepted{color:lime}
.declined{color:red}
</style>
</head>
<body>

<div class="app">
<div class="sidebar">
<h2>MSP 790</h2>
<button onclick="setTab('bookings')">Bookings</button>
<button onclick="setTab('calendar')">Calendar</button>
<button onclick="setTab('stats')">Stats</button>
</div>

<div class="main">
<div class="top">
<span>Admin Dashboard</span>
<button onclick="logout()">Logout</button>
</div>

<div class="content">

<div>
<input id="search" placeholder="Search">
<select id="serviceFilter">
<option value="">All Services</option>
<option>Video Editing</option>
<option>Video Production</option>
<option>Filming</option>
<option>Audio Production</option>
<option>Dance Lessons</option>
<option>Website Creation</option>
</select>

<select id="statusFilter">
<option value="">All Status</option>
<option>pending</option>
<option>accepted</option>
<option>declined</option>
</select>
</div>

<div id="statsTab">
<p>Total: <span id="total"></span></p>
<p>Revenue: $<span id="revenue"></span></p>
<canvas id="chart" height="120"></canvas>
</div>

<div id="bookingsTab"></div>
<div id="calendarTab"></div>

</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});

emailjs.init("2wR4xarDSJyemGTCQ");

const db=firebase.firestore();
let bookings=[];

firebase.auth().onAuthStateChanged(user=>{
 if(!user){location="login.html";return;}
 load();
});

function load(){
 db.collection("bookings").onSnapshot(snap=>{
  bookings=[];
  let revenue=0;
  snap.forEach(doc=>{
   let d=doc.data();
   if(d.status==="accepted") revenue+=d.price||0;
   bookings.push({id:doc.id,...d});
  });
  total.innerText=bookings.length;
  document.getElementById("revenue").innerText=revenue;
  render();
  chartBuild();
  buildCalendar();
 });
}

function render(){
 bookingsTab.innerHTML="";
 bookings.forEach(b=>{
  bookingsTab.innerHTML+=`
  <div class="card">
    <h3>${b.name}</h3>
    <p>${b.service}</p>
    <p>${b.date}</p>
    <p class="${b.status}">${b.status}</p>
    <button onclick="accept('${b.id}')">Accept</button>
    <select onchange="decline('${b.id}',this.value)">
      <option value="">Decline Reason</option>
      <option>Schedule conflict</option>
      <option>Project not fit</option>
      <option>Incomplete info</option>
    </select>
  </div>`;
 });
}

function accept(id){
 let price=prompt("Price?");
 db.collection("bookings").doc(id).update({
  status:"accepted",
  price:Number(price||0)
 });
}

function decline(id,reason){
 if(!reason) return;
 db.collection("bookings").doc(id).update({
  status:"declined",
  reason
 });
}

function buildCalendar(){
 calendarTab.innerHTML="";
 bookings.forEach(b=>{
  calendarTab.innerHTML+=`<div class="card">${b.name} - ${b.date}</div>`;
 });
}

let chart;
function chartBuild(){
 let data=[
  bookings.filter(b=>b.status==="pending").length,
  bookings.filter(b=>b.status==="accepted").length,
  bookings.filter(b=>b.status==="declined").length
 ];
 if(chart) chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
  type:"doughnut",
  data:{labels:["Pending","Accepted","Declined"],datasets:[{data,backgroundColor:["gold","lime","red"]}]}
 });
}

function setTab(tab){
 bookingsTab.style.display = tab==="bookings"?"block":"none";
 calendarTab.style.display = tab==="calendar"?"block":"none";
 statsTab.style.display = tab==="stats"?"block":"none";
}

function logout(){
 firebase.auth().signOut();
}
</script>

</body>
</html>
