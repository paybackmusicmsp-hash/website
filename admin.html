<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{background:#0a0a0a;color:white;font-family:Arial}
.header{background:#111;padding:15px}
.card{background:#111;padding:15px;margin:15px;border-radius:10px}
button{margin:5px;padding:8px;background:#800000;color:white;border:none}
.pending{color:gold}
.accepted{color:lime}
.declined{color:red}
</style>
</head>

<body>

<div class="header">
Admin Dashboard
<button onclick="logout()">Logout</button>
</div>

<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
  authDomain: "booking-8bc2d.firebaseapp.com",
  projectId: "booking-8bc2d"
});

const db = firebase.firestore();

// 🔐 THIS FIXES YOUR LOOP ISSUE
firebase.auth().onAuthStateChanged(user => {
  if (user) {
    console.log("Logged in:", user.email);
    loadBookings();
  } else {
    console.log("Not logged in");
    setTimeout(() => {
      if (!firebase.auth().currentUser) {
        window.location.href = "login.html";
      }
    }, 500); // gives Firebase time to restore session
  }
});

function loadBookings(){
  db.collection("bookings").onSnapshot(snap=>{
    list.innerHTML="";
    snap.forEach(doc=>{
      let d=doc.data();

      list.innerHTML += `
      <div class="card">
        <h3>${d.name}</h3>
        <p>${d.service}</p>
        <p>${d.date}</p>
        <p class="${d.status}">${d.status}</p>

        <button onclick="accept('${doc.id}','${d.email}')">Accept</button>
        <button onclick="decline('${doc.id}','${d.email}')">Decline</button>
      </div>`;
    });
  });
}

function accept(id,email){
  db.collection("bookings").doc(id).update({status:"accepted"});
  alert("Accepted + email sent (hook EmailJS next)");
}

function decline(id,email){
  db.collection("bookings").doc(id).update({status:"declined"});
}

function logout(){
  firebase.auth().signOut();
}
</script>

</body>
</html>
