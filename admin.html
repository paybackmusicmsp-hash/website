<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{background:#0a0a0a;color:white;font-family:Arial}
.header{padding:15px;background:#111}
.card{background:#111;padding:15px;margin:10px;border-radius:10px}
.status.pending{color:gold}
.status.accepted{color:lime}
.status.declined{color:red}
</style>
</head>

<body>

<div class="header">
Dashboard | <button onclick="logout()">Logout</button>
</div>

<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"booking-8bc2d.firebaseapp.com",
  projectId:"booking-8bc2d"
});

const db = firebase.firestore();

// 🔐 PROTECT PAGE
firebase.auth().onAuthStateChanged(user=>{
  if(!user) location="login.html";
});

// LOAD BOOKINGS
db.collection("bookings").onSnapshot(s=>{
  list.innerHTML="";
  s.forEach(doc=>{
    let d=doc.data();

    list.innerHTML+=`
    <div class="card">
      <h3>${d.name}</h3>
      <p>${d.service}</p>
      <p>${d.date}</p>

      <div class="status ${d.status}">${d.status}</div>

      <button onclick="accept('${doc.id}', '${d.email}')">Accept</button>
      <button onclick="decline('${doc.id}', '${d.email}')">Decline</button>
    </div>`;
  });
});

// ACCEPT → EMAIL + TRACK
function accept(id,email){
  db.collection("bookings").doc(id).update({status:"accepted"});

  sendEmail(email,"approved","Your booking is approved.");
}

// DECLINE
function decline(id,email){
  db.collection("bookings").doc(id).update({status:"declined"});
  sendEmail(email,"declined","Booking declined.");
}

// EMAIL (EmailJS)
function sendEmail(to,type,message){
  emailjs.send("YOUR_SERVICE","YOUR_TEMPLATE",{
    to_email:to,
    message:message
  });
}

// LOGOUT
function logout(){
  firebase.auth().signOut();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("YOUR_PUBLIC_KEY");
</script>

</body>
</html>
