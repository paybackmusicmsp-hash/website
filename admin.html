<!DOCTYPE html>
<html>
<head>
<title>MSP Admin</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial}
.app{display:flex}
.sidebar{width:220px;background:#0d0d0d;height:100vh;padding:20px}
.sidebar p{cursor:pointer;margin:12px 0;color:#aaa}
.sidebar p:hover{color:white}
.main{flex:1}
.top{background:#111;padding:15px;display:flex;justify-content:space-between}
.section{display:none;padding:20px}
.active{display:block}
.card{background:#111;padding:15px;margin:10px 0;border-radius:10px}
button{background:#800000;color:white;border:none;padding:6px;margin:4px;cursor:pointer}
.pending{color:gold}
.accepted{color:lime}
.declined{color:red}
#chart{max-width:300px;margin:auto}

/* CALENDAR FIX (responsive) */
.calendar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:8px;
}
.day{
  background:#111;
  padding:10px;
  border-radius:6px;
  min-height:80px;
  font-size:12px;
}
.day strong{
  display:block;
  margin-bottom:5px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <h2>⚡ MSP 790</h2>
  <p onclick="show('dashboard')">📊 Dashboard</p>
  <p onclick="show('bookings')">📦 Bookings</p>
  <p onclick="show('calendarSection')">📅 Calendar</p>
</div>

<div class="main">

<div class="top">
  <span>🛠️ Admin Panel</span>
  <button onclick="logout()">🚪 Logout</button>
</div>

<div id="dashboard" class="section active">
  <h3>📊 Stats</h3>
  <p>Total: <span id="total"></span></p>
  <p>Revenue: $<span id="revenue"></span></p>
  <canvas id="chart"></canvas>
</div>

<div id="bookings" class="section">
  <h3>📦 Bookings</h3>
  <div id="list"></div>
</div>

<div id="calendarSection" class="section">
  <h3>📅 Schedule</h3>
  <div class="calendar" id="calendar"></div>
</div>

</div>
</div>

<!-- FIREBASE (ONLY ONCE, CORRECT PLACE) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});

emailjs.init("2wR4xarDSJyemGTCQ");

const db = firebase.firestore();
let bookings = [];

/* 🔐 ADMIN LOCK (FIXED) */
firebase.auth().onAuthStateChanged(async user=>{
 if(!user){
   location="login.html";
   return;
 }

 const doc = await db.collection("users").doc(user.uid).get();

 if(!doc.exists || doc.data().role !== "admin"){
   alert("Access denied");
   firebase.auth().signOut();
   location="client-auth.html";
   return;
 }

 load();
});

/* NAV */
function show(id){
 document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

/* LOAD */
function load(){
 db.collection("bookings").onSnapshot(snap=>{
  bookings=[];
  let revenue=0;

  snap.forEach(doc=>{
   let d=doc.data();
   if(d.status==="accepted") revenue+=d.price||0;
   bookings.push({id:doc.id,...d});
  });

  document.getElementById("total").innerText = bookings.length;
  document.getElementById("revenue").innerText = revenue;

  render();
  buildChart();
  buildCalendar();
 });
}

/* BOOKINGS */
function render(){
 const list = document.getElementById("list");
 list.innerHTML="";

 bookings.forEach(b=>{
  list.innerHTML+=`
  <div class="card">
    <h3>${b.name}</h3>
    <p>🎯 ${b.service}</p>
    <p>📅 ${b.date}</p>
    <p class="${b.status}">📌 ${b.status}</p>
    <button onclick="accept('${b.id}')">✅</button>
    <button onclick="decline('${b.id}')">❌</button>
  </div>`;
 });
}

/* ACTIONS */
function accept(id){
 let price=prompt("Price?");
 db.collection("bookings").doc(id).update({
  status:"accepted",
  price:Number(price||0)
 });
}

function decline(id){
 db.collection("bookings").doc(id).update({
  status:"declined"
 });
}

/* CALENDAR (FIXED FOR ALL SCREENS) */
function buildCalendar(){
 const calendar = document.getElementById("calendar");
 calendar.innerHTML="";

 for(let i=1;i<=30;i++){
  let div=document.createElement("div");
  div.className="day";

  let dayBookings = bookings.filter(b=>{
    return b.date && b.date.includes("-"+String(i).padStart(2,"0"));
  });

  div.innerHTML = `<strong>${i}</strong>`;

  dayBookings.forEach(b=>{
    div.innerHTML += `<div>📌 ${b.name}</div>`;
  });

  calendar.appendChild(div);
 }
}

/* CHART */
let chart;
function buildChart(){
 let data=[
  bookings.filter(b=>b.status==="pending").length,
  bookings.filter(b=>b.status==="accepted").length,
  bookings.filter(b=>b.status==="declined").length
 ];

 if(chart) chart.destroy();

 chart=new Chart(document.getElementById("chart"),{
  type:"doughnut",
  data:{
   labels:["Pending","Accepted","Declined"],
   datasets:[{
     data,
     backgroundColor:["gold","lime","red"]
   }]
  },
  options:{
    plugins:{legend:{labels:{color:"white"}}}
  }
 });
}

/* LOGOUT */
function logout(){
 firebase.auth().signOut();
}
</script>

</body>
</html>
