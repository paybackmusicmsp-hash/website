<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
<style>
body { background:black; color:white; font-family:Arial; padding:20px; }
.card { background:#111; padding:15px; margin:10px 0; }
button { margin:5px; }
</style>
</head>

<body>

<h1>Dashboard</h1>
<div id="list"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "booking-8bc2d.firebaseapp.com",
  projectId: "booking-8bc2d"
});

const db = firebase.firestore();

db.collection("bookings").orderBy("created","desc").onSnapshot(snap => {
  const el = document.getElementById("list");
  el.innerHTML = "";

  snap.forEach(doc => {
    const d = doc.data();

    el.innerHTML += `
      <div class="card">
        <h3>${d.name}</h3>
        <p>${d.service}</p>
        <p>${d.date} ${d.time}</p>

        <select id="r-${doc.id}">
          <option>Scheduling conflict</option>
          <option>Not a good fit</option>
          <option>Incomplete info</option>
        </select>

        <button onclick="accept('${doc.id}','${d.email}')">Accept</button>
        <button onclick="decline('${doc.id}','${d.email}')">Decline</button>
      </div>
    `;
  });
});

function accept(id,email){
  db.collection("bookings").doc(id).update({status:"accepted"});
  window.location.href = `mailto:${email}?subject=Approved&body=Your booking is approved. Proceed to payment.`;
}

function decline(id,email){
  const reason = document.getElementById("r-"+id).value;
  db.collection("bookings").doc(id).update({status:"declined",reason});
  window.location.href = `mailto:${email}?subject=Update&body=Booking declined: ${reason}`;
}
</script>

</body>
</html>
