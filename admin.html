<!DOCTYPE html>
<html>
<head>
<title>MSP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial}
.app{display:flex}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#111;
  height:100vh;
  padding:20px;
}
.sidebar p{
  cursor:pointer;
  padding:10px;
  border-radius:6px;
}
.sidebar p:hover{
  background:#800000;
}

/* MAIN */
.main{flex:1}
.top{
  background:#111;
  padding:15px;
  display:flex;
  justify-content:space-between;
}
.content{padding:20px}

.card{
  background:#111;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

button{
  background:#800000;
  color:white;
  border:none;
  padding:6px;
  margin:3px;
  cursor:pointer;
}

.pending{color:gold}
.accepted{color:lime}
.declined{color:red}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>MSP 790</h2>
<p onclick="showSection('dashboard')">Dashboard</p>
<p onclick="showSection('bookings')">Bookings</p>
<p onclick="showSection('calendar')">Calendar</p>
</div>

<!-- MAIN -->
<div class="main">

<div class="top">
<span>Admin Panel</span>
<button onclick="logout()">Logout</button>
</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboardSection">
<h3>Stats</h3>
<p>Total: <span id="total"></span></p>
<canvas id="chart" height="120"></canvas>
</div>

<!-- BOOKINGS -->
<div id="bookingsSection" style="display:none">
<h3>Bookings</h3>
<div id="list"></div>
</div>

<!-- CALENDAR -->
<div id="calendarSection" style="display:none">
<h3>Calendar</h3>
<div id="calendar"></div>
</div>

</div>
</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});

const db = firebase.firestore();
let bookings = [];
let chart;

/* AUTH */
firebase.auth().onAuthStateChanged(user=>{
 if(!user){location="login.html";return;}
 load();
});

/* LOAD DATA */
function load(){
 db.collection("bookings").onSnapshot(snap=>{
  bookings = [];
  snap.forEach(doc=>{
   bookings.push({id:doc.id,...doc.data()});
  });

  total.innerText = bookings.length;

  render();
  buildChart();
  buildCalendar();
 });
}

/* BOOKINGS UI */
function render(){
 list.innerHTML="";
 bookings.forEach(b=>{
  list.innerHTML += `
  <div class="card">
    <h3>${b.name}</h3>
    <p>${b.service}</p>
    <p>${b.date}</p>
    <p class="${b.status}">${b.status}</p>

    <button onclick="accept('${b.id}')">Accept</button>
    <button onclick="decline('${b.id}')">Decline</button>
  </div>`;
 });
}

/* BUTTON ACTIONS */
function accept(id){
 let price = prompt("Enter price:");
 if(price===null) return;

 db.collection("bookings").doc(id).update({
  status:"accepted",
  price:Number(price||0)
 }).then(()=>alert("Accepted"));
}

function decline(id){
 let reason = prompt("Reason?");
 if(reason===null) return;

 db.collection("bookings").doc(id).update({
  status:"declined",
  reason
 }).then(()=>alert("Declined"));
}

/* CHART */
function buildChart(){
 const ctx = document.getElementById("chart");

 let data = [
  bookings.filter(b=>b.status==="pending").length,
  bookings.filter(b=>b.status==="accepted").length,
  bookings.filter(b=>b.status==="declined").length
 ];

 if(chart) chart.destroy();

 chart = new Chart(ctx,{
  type:"doughnut",
  data:{
   labels:["Pending","Accepted","Declined"],
   datasets:[{
    data:data,
    backgroundColor:["gold","lime","red"]
   }]
  },
  options:{
   plugins:{
    legend:{labels:{color:"white"}}
   }
  }
 });
}

/* REAL CALENDAR */
function buildCalendar(){
 const cal = document.getElementById("calendar");
 cal.innerHTML="";

 const grid = document.createElement("div");
 grid.style.display="grid";
 grid.style.gridTemplateColumns="repeat(7,1fr)";
 grid.style.gap="10px";

 const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 days.forEach(d=>{
  let el=document.createElement("div");
  el.innerHTML=`<strong>${d}</strong>`;
  el.style.textAlign="center";
  grid.appendChild(el);
 });

 let date=new Date();
 date.setDate(1);

 let startDay=date.getDay();

 for(let i=0;i<startDay;i++){
  grid.appendChild(document.createElement("div"));
 }

 let month=date.getMonth();

 while(date.getMonth()===month){
  let box=document.createElement("div");
  box.style.background="#111";
  box.style.padding="10px";
  box.style.borderRadius="8px";
  box.style.minHeight="80px";

  let formatted=date.toISOString().split("T")[0];

  box.innerHTML=`<strong>${date.getDate()}</strong><br>`;

  bookings.forEach(b=>{
   if(b.date===formatted){
    box.innerHTML+=`<div style="font-size:12px;color:lime">${b.name}</div>`;
   }
  });

  grid.appendChild(box);
  date.setDate(date.getDate()+1);
 }

 cal.appendChild(grid);
}

/* SIDEBAR NAV */
function showSection(section){
 document.getElementById("dashboardSection").style.display="none";
 document.getElementById("bookingsSection").style.display="none";
 document.getElementById("calendarSection").style.display="none";

 if(section==="dashboard") dashboardSection.style.display="block";
 if(section==="bookings") bookingsSection.style.display="block";
 if(section==="calendar") calendarSection.style.display="block";
}

/* LOGOUT */
function logout(){
 firebase.auth().signOut();
}
</script>

</body>
</html>
