<!DOCTYPE html>
<html>
<head>
<title>MSP Admin</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family:Arial;
}

/* LAYOUT */
.app{display:flex}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#0d0d0d;
  height:100vh;
  padding:20px;
  border-right:1px solid #222;
}

.sidebar h2{
  margin-bottom:20px;
}

.sidebar p{
  margin:12px 0;
  color:#aaa;
  cursor:pointer;
  transition:.2s;
}

.sidebar p:hover{
  color:white;
}

/* MAIN */
.main{flex:1}

.top{
  background:#111;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* CONTENT */
.content{
  padding:20px;
  max-width:1100px;
  margin:auto;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.stat-card{
  background:#111;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(128,0,0,0.2);
}

/* CARDS */
.card{
  background:#111;
  padding:15px;
  margin:12px 0;
  border-radius:10px;
  transition:.2s;
}

.card:hover{
  transform:scale(1.02);
}

/* BUTTONS */
button{
  background:#800000;
  color:white;
  border:none;
  padding:6px 10px;
  margin:4px;
  cursor:pointer;
  border-radius:6px;
}

button:hover{background:red}

/* STATUS */
.pending{color:gold}
.accepted{color:lime}
.declined{color:red}
.paid{color:cyan}

/* CHART FIX */
#chart{
  max-width:300px;
  margin:20px auto;
}

/* CALENDAR */
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.calendar-item{
  background:#111;
  padding:10px;
  border-radius:8px;
  font-size:0.9rem;
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>⚡ MSP 790</h2>
  <p>📊 Dashboard</p>
  <p>📦 Bookings</p>
  <p>💰 Revenue</p>
</div>

<!-- MAIN -->
<div class="main">

<div class="top">
  <span>🛠️ Admin Panel</span>
  <button onclick="logout()">🚪 Logout</button>
</div>

<div class="content">

<!-- STATS -->
<div class="stats">
  <div class="stat-card">
    <h3>📦 Total Bookings</h3>
    <h2 id="total">0</h2>
  </div>

  <div class="stat-card">
    <h3>💰 Revenue</h3>
    <h2>$<span id="revenue">0</span></h2>
  </div>
</div>

<!-- CHART -->
<canvas id="chart"></canvas>

<!-- BOOKINGS -->
<h3>📦 Bookings</h3>
<div id="list"></div>

<!-- CALENDAR -->
<h3>📅 Schedule</h3>
<div class="calendar-grid" id="calendar"></div>

</div>
</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});

emailjs.init("2wR4xarDSJyemGTCQ");

const db=firebase.firestore();
let bookings=[];

/* AUTH */
firebase.auth().onAuthStateChanged(user=>{
 if(!user){location="login.html";return;}
 load();
});

/* LOAD */
function load(){
 db.collection("bookings").onSnapshot(snap=>{
  bookings=[];
  let revenue=0;

  snap.forEach(doc=>{
   let d=doc.data();
   if(d.status==="accepted") revenue+=d.price||0;
   bookings.push({id:doc.id,...d});
  });

  total.innerText=bookings.length;
  document.getElementById("revenue").innerText=revenue;

  render();
  buildChart();
  buildCalendar();
 });
}

/* BOOKINGS UI */
function render(){
 list.innerHTML="";

 bookings.forEach(b=>{
  list.innerHTML+=`
  <div class="card">
    <h3>${b.name}</h3>
    <p>🎯 ${b.service}</p>
    <p>📅 ${b.date}</p>
    <p class="${b.status}">📌 ${b.status}</p>
    <p>${b.paid?"💰 Paid":"❌ Unpaid"}</p>

    <button onclick="accept('${b.id}')">✅ Accept</button>
    <button onclick="decline('${b.id}')">❌ Decline</button>
    <button onclick="togglePaid('${b.id}',${b.paid})">💵 Paid</button>
  </div>`;
 });
}

/* ACTIONS */
function accept(id){
 let b=bookings.find(x=>x.id===id);
 let price=prompt("Enter price:");
 db.collection("bookings").doc(id).update({
  status:"accepted",
  price:Number(price||0),
  paid:false
 });

 emailjs.send("service_0d8mpyv","template_ddmaqku",{
  ...b,
  status:"ACCEPTED",
  message:`Approved. Price: $${price}`
 });
}

function decline(id){
 let b=bookings.find(x=>x.id===id);
 let reason=prompt("Reason?");
 db.collection("bookings").doc(id).update({
  status:"declined",
  reason
 });

 emailjs.send("service_0d8mpyv","template_ddmaqku",{
  ...b,
  status:"DECLINED",
  message:reason
 });
}

function togglePaid(id,current){
 db.collection("bookings").doc(id).update({paid:!current});
}

/* CALENDAR */
function buildCalendar(){
 calendar.innerHTML="";
 bookings.forEach(b=>{
  let div=document.createElement("div");
  div.className="calendar-item";
  div.innerHTML=`📅 ${b.date}<br>${b.name}`;
  calendar.appendChild(div);
 });
}

/* CHART */
let chart;
function buildChart(){
 let data=[
  bookings.filter(b=>b.status==="pending").length,
  bookings.filter(b=>b.status==="accepted").length,
  bookings.filter(b=>b.status==="declined").length
 ];

 if(chart) chart.destroy();

 chart=new Chart(document.getElementById("chart"),{
  type:"doughnut",
  data:{
   labels:["Pending","Accepted","Declined"],
   datasets:[{
     data,
     backgroundColor:["gold","lime","red"]
   }]
  },
  options:{
    plugins:{
      legend:{labels:{color:"white"}}
    }
  }
 });
}

/* LOGOUT */
function logout(){
 firebase.auth().signOut();
}
</script>

</body>
</html>
