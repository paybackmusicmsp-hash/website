<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
<style>
body { background:black; color:white; font-family:Arial; padding:20px; }
.card { background:#111; padding:15px; margin:10px 0; }
button { margin:5px; }
</style>
</head>

<body>

<h1>Admin Dashboard</h1>
<div id="bookings"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const pass = prompt("Enter password");
if (pass !== "msp790") {
  document.body.innerHTML = "Access Denied";
}

firebase.initializeApp({
  apiKey: "AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
  authDomain: "booking-8bc2d.firebaseapp.com",
  projectId: "booking-8bc2d"
});

const db = firebase.firestore();

db.collection("bookings").orderBy("created","desc").onSnapshot(snapshot => {
  const container = document.getElementById("bookings");
  container.innerHTML = "";

  snapshot.forEach(doc => {
    const d = doc.data();

    container.innerHTML += `
      <div class="card">
        <h3>${d.name}</h3>
        <p>${d.service}</p>
        <p>${d.date} @ ${d.time}</p>
        <p>Status: ${d.status}</p>

        <button onclick="update('${doc.id}','accepted')">Accept</button>
        <button onclick="update('${doc.id}','declined')">Decline</button>
        <a href="mailto:${d.email}"><button>Email</button></a>
      </div>
    `;
  });
});

function update(id, status) {
  db.collection("bookings").doc(id).update({ status });
}
</script>

</body>
</html>
