<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG StarMoney</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;700&display=swap');

/* PAGE TRANSITION */
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: black;
  color: white;
  opacity: 0;
  transition: opacity 0.6s ease;
}

body.active { opacity: 1; }

/* HERO */
.hero {
  height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  text-shadow: 0 0 20px red;
}

/* IMAGE */
.artist-img {
  width: 300px;
  border-radius: 12px;
  margin-top: 20px;
}

/* BIO */
.bio {
  max-width: 700px;
  margin: 40px auto;
  text-align: center;
  padding: 0 20px;
}

/* PLATFORMS */
.platforms {
  text-align: center;
  margin-top: 30px;
}

.platforms i {
  font-size: 2rem;
  margin: 10px;
  transition: 0.3s;
}

.platforms i:hover {
  color: red;
  transform: scale(1.2);
}

/* BACK BUTTON */
.back {
  position: fixed;
  top: 20px;
  left: 20px;
  font-family: 'Bebas Neue';
  cursor: pointer;
}
</style>
</head>

<body>

<div class="back" onclick="goBack()">← BACK</div>

<div class="hero">
  <h1>OG StarMoney</h1>
  <img src="assets/Capture.PNG" class="artist-img">
</div>

<div class="bio">
  <p>Full artist profile coming soon.</p>
</div>

<div class="platforms">
  <i class="fab fa-spotify"></i>
  <i class="fab fa-apple"></i>
  <i class="fab fa-youtube"></i>
</div>

<script>
function goBack() {
  document.body.classList.remove("active");
  setTimeout(() => {
    window.location.href = "index.html";
  }, 500);
}

/* FADE IN */
window.addEventListener("load", () => {
  document.body.classList.add("active");
});

/* LINK TRANSITIONS */
document.querySelectorAll("a").forEach(link => {
  link.addEventListener("click", function(e) {
    e.preventDefault();
    document.body.classList.remove("active");
    setTimeout(() => {
      window.location = this.href;
    }, 500);
  });
});
</script>

</body>
</html>
