<!DOCTYPE html>
<html>
<head>
<title>Join MSP 790</title>
<style>
body{background:black;color:white;font-family:Arial}
.container{max-width:600px;margin:auto;padding:40px}
input,textarea,select{width:100%;padding:12px;margin:10px 0;background:#111;color:white}
button{width:100%;padding:12px;background:#800000;color:white;border:none}
</style>
</head>
<body>

<div class="container">
<h1>Join MSP 790</h1>

<form id="joinForm">
<input name="name" placeholder="Name" required>
<input name="email" type="email" required>
<select name="role">
<option>Artist</option>
<option>Producer</option>
<option>Videographer</option>
<option>Dancer</option>
<option>Web Designer</option>
</select>
<textarea name="bio" placeholder="Tell us about you"></textarea>
<button>Apply</button>
</form>

<p id="msg"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});

const db=firebase.firestore();

joinForm.addEventListener("submit",async e=>{
 e.preventDefault();
 let f=e.target;

 await db.collection("applications").add({
  name:f.name.value,
  email:f.email.value,
  role:f.role.value,
  bio:f.bio.value,
  created:new Date()
 });

 msg.innerText="Application sent.";
});
</script>

</body>
</html>
