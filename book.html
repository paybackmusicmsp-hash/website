<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book MSP 790 Services</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  text-align: center;
  padding: 40px;
}
.container {
  max-width: 600px;
  margin: auto;
}
.box {
  background: #111;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}
button {
  width: 100%;
  padding: 12px;
  background: #800000;
  color: white;
  border: none;
}
.notice { color: red; }
</style>
</head>

<body>

<div class="container">

<h1>Book Our Services</h1>

<div class="box">🎬 Video Editing</div>
<div class="box">🎥 Directing</div>
<div class="box">📹 Filming</div>
<div class="box">🎧 Music Production</div>
<div class="box">💃 Dance Lessons</div>
<div class="box">💻 Website Creation</div>

<div class="box">
<h3>Availability</h3>
<p>Mon–Fri | 2PM–7PM</p>
</div>

<div class="box">
<h3>Pricing</h3>
<p>$75 – $300+ (varies per project)</p>
</div>

<p class="notice">Weekends closed. Red dates unavailable.</p>

<form id="bookingForm">
<input name="name" placeholder="Name" required>
<input name="email" type="email" placeholder="Email" required>

<select name="service" required>
<option value="">Select Service</option>
<option>Video Editing</option>
<option>Directing</option>
<option>Filming</option>
<option>Music Production</option>
<option>Dance Lessons</option>
<option>Website Creation</option>
</select>

<input id="calendar" placeholder="Pick a date" required>
<p id="dateWarning" style="display:none; color:red;">Date is taken</p>

<input type="time" name="time" min="14:00" max="19:00" required>

<textarea name="details" placeholder="Project details" required></textarea>

<button type="submit">Submit Request</button>
</form>

<p>We will respond within 24–48 hours.</p>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
  authDomain: "booking-8bc2d.firebaseapp.com",
  projectId: "booking-8bc2d"
});

const db = firebase.firestore();
let bookedDates = [];

// LIVE BOOKINGS
db.collection("bookings").onSnapshot(snapshot => {
  bookedDates = [];
  snapshot.forEach(doc => {
    if (doc.data().status === "accepted") {
      bookedDates.push(doc.data().date);
    }
  });
});

// CALENDAR
flatpickr("#calendar", {
  dateFormat: "Y-m-d",
  disable: [
    d => d.getDay() === 0 || d.getDay() === 6,
    d => bookedDates.includes(d.toISOString().split("T")[0])
  ],
  onChange: (sel, str) => {
    document.getElementById("dateWarning").style.display =
      bookedDates.includes(str) ? "block" : "none";
  }
});

// SUBMIT
document.getElementById("bookingForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;

  await db.collection("bookings").add({
    name: f.name.value,
    email: f.email.value,
    service: f.service.value,
    date: document.getElementById("calendar").value,
    time: f.time.value,
    details: f.details.value,
    status: "pending",
    created: new Date()
  });

  alert("Request received.");
  window.location.href = "pay.html";
});
</script>

</body>
</html>
