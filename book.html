<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Book MSP 790</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body { background:black; color:white; font-family:Arial; text-align:center; padding:40px; }
.container { max-width:600px; margin:auto; }
.box { background:#111; padding:15px; margin:10px 0; border-radius:8px; }
input, select, textarea { width:100%; padding:10px; margin:10px 0; }
button { width:100%; padding:12px; background:#800000; color:white; border:none; }
</style>
</head>

<body>

<div class="container">

<h1>Book Services</h1>

<div class="box">🎬 Video Editing</div>
<div class="box">🎥 Directing</div>
<div class="box">🎧 Music Production</div>

<div class="box">Mon–Fri | 2PM–7PM</div>

<form id="bookingForm">

<input name="name" placeholder="Name" required>
<input name="email" type="email" placeholder="Email" required>

<select name="service" required>
<option value="">Service</option>
<option>Video Editing</option>
<option>Directing</option>
<option>Music Production</option>
</select>

<input id="calendar" placeholder="Pick date" required>
<input type="time" name="time" min="14:00" max="19:00" required>

<textarea name="details" placeholder="Details" required></textarea>

<button type="submit">Submit Request</button>

</form>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "booking-8bc2d.firebaseapp.com",
  projectId: "booking-8bc2d"
});

const db = firebase.firestore();
let bookedDates = [];

// load booked dates
db.collection("bookings").onSnapshot(snap => {
  bookedDates = [];
  snap.forEach(doc => {
    if (doc.data().status === "accepted") {
      bookedDates.push(doc.data().date);
    }
  });
});

// calendar
flatpickr("#calendar", {
  dateFormat: "Y-m-d",
  disable: [
    d => d.getDay() === 0 || d.getDay() === 6,
    d => bookedDates.includes(d.toISOString().split("T")[0])
  ]
});

// submit
document.getElementById("bookingForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;

  await db.collection("bookings").add({
    name: f.name.value,
    email: f.email.value,
    service: f.service.value,
    date: document.getElementById("calendar").value,
    time: f.time.value,
    details: f.details.value,
    status: "pending",
    created: new Date()
  });

  alert("Request received.");
  window.location.href = "pay.html";
});
</script>

</body>
</html>
