<!DOCTYPE html>
<html>
<head>
<title>Book</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<style>
body{background:#0a0a0a;color:white;text-align:center}
.service{background:#111;padding:15px;margin:10px;border-radius:10px;cursor:pointer}
.service-content{max-height:0;overflow:hidden}
.service.active .service-content{max-height:100px}
footer{position:fixed;bottom:0;width:100%;background:#111;padding:10px}
</style>
</head>
<body>

<h1>Book Services</h1>

<div class="service" onclick="toggle(this)">Video Editing<div class="service-content">Coming soon</div></div>
<div class="service" onclick="toggle(this)">Video Production<div class="service-content">Coming soon</div></div>

<form id="bookingForm">
<input name="name" placeholder="Name">
<input name="email" placeholder="Email">
<select name="service">
<option>Video Editing</option>
</select>
<input id="calendar">
<input type="time" name="time">
<button>Submit</button>
</form>

<footer>
<a href="#">CashApp</a>
<a href="#">Zelle</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});
const db=firebase.firestore();

flatpickr("#calendar",{dateFormat:"Y-m-d"});

function toggle(el){el.classList.toggle("active");}

bookingForm.addEventListener("submit",async e=>{
 e.preventDefault();
 await db.collection("bookings").add({
  name:bookingForm.name.value,
  email:bookingForm.email.value,
  service:bookingForm.service.value,
  date:calendar.value,
  status:"pending"
 });
 alert("Submitted");
});
</script>

</body>
</html>
