<!DOCTYPE html>
<html>
<head>
<title>Book</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body{background:black;color:white;font-family:Arial;text-align:center;padding:40px}
.container{max-width:600px;margin:auto;padding-bottom:120px}
.card{background:#111;padding:15px;margin:10px;border-radius:10px}
input,select,textarea{width:100%;padding:10px;margin:10px 0}
button{background:#800000;color:white;padding:12px;width:100%}
footer{position:fixed;bottom:0;width:100%;background:#111;padding:10px}
</style>
</head>

<body>

<div class="container">

<h1>Book Services</h1>

<div class="card">🎬 Video Editing</div>
<div class="card">🎥 Production</div>
<div class="card">📹 Filming</div>
<div class="card">🎧 Audio</div>
<div class="card">💃 Dance</div>
<div class="card">💻 Website Creation</div>

<div class="card">
Mon–Fri | 2PM–7PM
</div>

<form id="bookingForm">
<input name="name" placeholder="Name" required>
<input name="email" placeholder="Email" required>

<select name="service">
<option>Video Editing</option>
<option>Production</option>
<option>Filming</option>
<option>Audio</option>
<option>Dance</option>
<option>Website</option>
</select>

<input id="calendar" placeholder="Pick date" required>
<input type="time" name="time" min="14:00" max="19:00" required>

<textarea name="details" placeholder="Details"></textarea>

<button type="submit">Submit</button>
</form>

</div>

<footer>
CashApp | PayPal | Zelle
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
  projectId: "booking-8bc2d"
});

const db = firebase.firestore();

flatpickr("#calendar",{dateFormat:"Y-m-d"});

document.getElementById("bookingForm").addEventListener("submit", async e=>{
  e.preventDefault();
  let f=e.target;

  await db.collection("bookings").add({
    name:f.name.value,
    email:f.email.value,
    service:f.service.value,
    date:calendar.value,
    time:f.time.value,
    details:f.details.value,
    status:"pending"
  });

  alert("Submitted!");
});
</script>

</body>
</html>
