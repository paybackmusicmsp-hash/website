<!DOCTYPE html>
<html>
<head>
<title>Book MSP 790</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  text-align:center;
}

.container {
  max-width:650px;
  margin:auto;
  padding:40px 20px 120px;
  animation:fade 0.6s;
}

@keyframes fade {
  from{opacity:0} to{opacity:1}
}

.box {
  background:#111;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  transition:.3s;
}
.box:hover { transform:scale(1.03); box-shadow:0 0 10px red; }

input,select,textarea {
  width:100%;
  padding:12px;
  margin:10px 0;
}

button {
  width:100%;
  padding:14px;
  background:#800000;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div class="container">
<h1>Book Services</h1>

<div class="box">🎬 Video Editing</div>
<div class="box">🎥 Video Production</div>
<div class="box">📹 Video Filming</div>
<div class="box">🎧 Audio Production</div>
<div class="box">💃 Dance Lessons</div>
<div class="box">💻 Website Creation</div>

<div class="box">
<p>Mon–Fri | 2PM–7PM</p>
<p>$75–$300+</p>
</div>

<form id="bookingForm">
<input name="name" placeholder="Name" required>
<input name="email" type="email" required>

<select name="service" required>
<option value="">Service</option>
<option>Video Editing</option>
<option>Video Production</option>
<option>Video Filming</option>
<option>Audio Production</option>
<option>Dance Lessons</option>
<option>Website Creation</option>
</select>

<input id="calendar" required>
<input type="time" name="time" min="14:00" max="19:00" required>

<textarea name="details" required></textarea>

<button>Submit Request</button>
</form>
</div>

<footer style="background:#111;position:fixed;bottom:0;width:100%;padding:15px;">
MSP 790 |
<a href="#">CashApp</a> |
<a href="#">PayPal</a> |
<a href="#">Zelle</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"booking-8bc2d"
});
const db=firebase.firestore();

let booked=[];

db.collection("bookings").onSnapshot(s=>{
  booked=[];
  s.forEach(d=>{
    if(d.data().status==="accepted") booked.push(d.data().date);
  });
});

flatpickr("#calendar",{
  dateFormat:"Y-m-d",
  disable:[
    d=>d.getDay()==0||d.getDay()==6,
    d=>booked.includes(d.toISOString().split("T")[0])
  ]
});

document.getElementById("bookingForm").onsubmit=async e=>{
  e.preventDefault();
  let f=e.target;

  await db.collection("bookings").add({
    name:f.name.value,
    email:f.email.value,
    service:f.service.value,
    date:calendar.value,
    time:f.time.value,
    details:f.details.value,
    status:"pending",
    created:new Date()
  });

  alert("Request sent");
  location="pay.html";
};
</script>

</body>
</html>
