<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MSP 790 favicon</title>
  <desc id="desc">Simplified circular MSP logo with red gothic lettering and red star accents.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="72%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d6d6d6"/>
      <stop offset="52%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="mspRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff3535"/>
      <stop offset="55%" stop-color="#d30000"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#ff3b3b" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#850000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#ring)"/>
  <circle cx="32" cy="32" r="28.5" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="27.2" fill="none" stroke="#2d2d2d" stroke-width="0.8"/>

  <g fill="#ff1a1a" opacity="0.96">
    <path d="M32 8.8 33.1 13.2 37.5 12.1 34.2 15.4 37.5 18.7 33.1 17.6 32 22 30.9 17.6 26.5 18.7 29.8 15.4 26.5 12.1 30.9 13.2Z"/>
    <path d="M9.4 32 10.3 35.2 13.6 34.3 11.1 36.8 13.6 39.3 10.3 38.4 9.4 41.6 8.6 38.4 5.2 39.3 7.7 36.8 5.2 34.3 8.6 35.2Z"/>
    <path d="M54.6 32 55.4 35.2 58.8 34.3 56.3 36.8 58.8 39.3 55.4 38.4 54.6 41.6 53.7 38.4 50.4 39.3 52.9 36.8 50.4 34.3 53.7 35.2Z"/>
  </g>

  <text x="32" y="39" text-anchor="middle" font-size="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-style="italic" letter-spacing="-1.2" fill="url(#mspRed)" stroke="#fff7f7" stroke-width="1.1" paint-order="stroke fill" filter="url(#glow)">MSP</text>
  <text x="32" y="51" text-anchor="middle" font-size="7.2" font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#f4f4f4" opacity="0.96">790</text>
