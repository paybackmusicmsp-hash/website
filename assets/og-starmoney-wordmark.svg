<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">OG StarMoney wordmark</title>
  <desc id="desc">Custom red and black angular wordmark for OG StarMoney.</desc>
  <defs>
    <linearGradient id="strokeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8d8d"/>
      <stop offset="45%" stop-color="#ff4747"/>
      <stop offset="100%" stop-color="#8f0000"/>
    </linearGradient>
    <linearGradient id="fillDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180202"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <filter id="redGlow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff5252" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8b0000" flood-opacity="0.45"/>
    </filter>
    <style>
      .outline {
        fill: url(#fillDark);
        stroke: url(#strokeRed);
        stroke-width: 14;
        stroke-linejoin: bevel;
      }
      .inner {
        fill: none;
        stroke: rgba(255, 220, 220, 0.22);
        stroke-width: 4;
        stroke-linejoin: bevel;
      }
    </style>
  </defs>

