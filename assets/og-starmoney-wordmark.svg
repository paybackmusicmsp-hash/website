<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">OG StarMoney wordmark</title>
  <desc id="desc">Outlined red neon wordmark for OG StarMoney.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');

      .wordmark {
        font-family: "Black Ops One", Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: 210px;
        letter-spacing: 10px;
        text-transform: uppercase;
        fill: #060000;
        stroke: #ff5d5d;
        stroke-width: 18px;
        paint-order: stroke fill;
        filter: url(#neon);
      }

      .inner {
        font-family: "Black Ops One", Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: 210px;
        letter-spacing: 10px;
        text-transform: uppercase;
        fill: transparent;
        stroke: #ffb0b0;
        stroke-width: 3px;
        opacity: 0.45;
      }
    </style>

    <filter id="neon" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff7373" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#7f0000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g transform="translate(800 226)">
    <text class="wordmark" text-anchor="middle">OG STARMONEY</text>
    <text class="inner" text-anchor="middle">OG STARMONEY</text>
  </g>
</svg>
