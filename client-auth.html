<!DOCTYPE html>
<html>
<head>
<title>Client Portal</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center}
.box{max-width:400px;margin:100px auto;background:#111;padding:30px;border-radius:12px}
input,button{width:100%;padding:12px;margin:10px 0}
button{background:#800000;color:white;border:none}
</style>
</head>
<body>

<div class="box">
<h2>Client Portal</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyC1pKUto9-16yt6jcYxzyPOfF4VBWeAit4",
 authDomain:"booking-8bc2d.firebaseapp.com",
 projectId:"booking-8bc2d"
});

const db = firebase.firestore();

function signup(){
 firebase.auth().createUserWithEmailAndPassword(email.value, pass.value)
 .then(async cred=>{
   await db.collection("users").doc(cred.user.uid).set({
     email: email.value,
     role: "client",
     created: new Date()
   });
   location="client.html";
 })
 .catch(err=>alert(err.message));
}

function login(){
 firebase.auth().signInWithEmailAndPassword(email.value, pass.value)
 .then(()=>location="client.html")
 .catch(err=>alert(err.message));
}
</script>

</body>
</html>
