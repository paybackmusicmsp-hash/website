<!DOCTYPE html>
<html>
<head>
<title>Invoice</title>

<style>
body{background:black;color:white;text-align:center;padding:40px}
.box{background:#111;padding:30px;border-radius:10px}
.btn{display:block;margin:10px;padding:12px;background:#800000;color:white}
</style>
</head>

<body>

<div class="box">
<h1>Invoice</h1>

<p id="invoice"></p>
<p>Deposit Required</p>

<a class="btn" href="https://cash.app/$YourTag" target="_blank">CashApp</a>
<a class="btn" href="https://paypal.me/yourname" target="_blank">PayPal</a>

</div>

<script>
const id = new URLSearchParams(window.location.search).get("id");
document.getElementById("invoice").innerText = "Invoice #" + id;
</script>

</body>
</html>
